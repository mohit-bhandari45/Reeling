services:
  postgres:
    build: ./docker/postgres
    container_name: reeling-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - reeling-pgdata:/var/lib/postgresql/data

volumes:
  reeling-pgdata: